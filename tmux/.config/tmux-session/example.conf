# Example project template. Copy it to <name>.conf and `tmux-session <name>`
# will build that session from it, e.g.:
#   cp example.conf myproj.conf && tmux-session myproj
#
# One window per line:  name | directory | command
# - directory: optional, defaults to where tmux-session was run
# - command:   optional, typed into the window on creation
# - ~ and $SESSION (the session name) are expanded in both fields
# The first window is selected on attach.

editor | ~/dev/$SESSION       | nvim
shell  | ~/dev/$SESSION       |
build  | ~/dev/$SESSION/build | cmake --build .
git    | ~/dev/$SESSION       | git status
here   |                      |
