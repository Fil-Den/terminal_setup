# tmux config
# Example setup tuned for Neovim. Reload with <prefix> r.

# --- General -----------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"      # true color
set -s escape-time 10                   # no lag after <Esc> in Neovim
set -g focus-events on                  # lets Neovim reload files changed on disk
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on                 # copy to the system clipboard via OSC 52

# Number windows and panes from 1, and keep window numbers without gaps
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Key bindings ------------------------------------------------------------

bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Splits and new windows open in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Move between panes with h/j/k/l, resize with H/J/K/L
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi keys in copy mode: v to select, y to copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Status bar --------------------------------------------------------------

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=colour250"
set -g status-left "#[fg=colour39,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=colour244]%Y-%m-%d %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=colour39,bold] #I:#W "
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"

# Machine-specific / private overrides (not tracked)
source-file -q ~/.tmux.local.conf
